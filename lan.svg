<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151a2b"/>
    </linearGradient>
    <clipPath id="barClipLang">
      <rect x="40" y="60" width="820" height="14" rx="7"/>
    </clipPath>
    <clipPath id="barClipFw">
      <rect x="40" y="252" width="820" height="14" rx="7"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="450" rx="14" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>

  <!-- ===== Languages ===== -->
  <text x="450" y="42" font-size="20" font-weight="700" fill="#6d7cf7" text-anchor="middle">Languages</text>

  <g clip-path="url(#barClipLang)">
    <rect x="40"   y="60" width="184.4" height="14" fill="#00B4AB"/> <!-- Dart -->
    <rect x="224.4" y="60" width="180.1" height="14" fill="#ED8B00"/> <!-- Java -->
    <rect x="404.5" y="60" width="160.5" height="14" fill="#F7DF1E"/> <!-- JS/TS -->
    <rect x="565.0" y="60" width="151.9" height="14" fill="#4169E1"/> <!-- SQL -->
    <rect x="716.9" y="60" width="143.1" height="14" fill="#3776AB"/> <!-- Python -->
  </g>

  <!-- Legend row 1 -->
  <circle cx="46" cy="97" r="5" fill="#00B4AB"/>
  <text x="58" y="102" font-size="15" fill="#c9d1d9">Dart</text>
  <text x="420" y="102" font-size="13" fill="#8b949e" text-anchor="end">85% · Advanced</text>

  <circle cx="486" cy="97" r="5" fill="#ED8B00"/>
  <text x="498" y="102" font-size="15" fill="#c9d1d9">Java</text>
  <text x="860" y="102" font-size="13" fill="#8b949e" text-anchor="end">83% · Advanced</text>

  <!-- Legend row 2 -->
  <circle cx="46" cy="131" r="5" fill="#F7DF1E"/>
  <text x="58" y="136" font-size="15" fill="#c9d1d9">JavaScript / TypeScript</text>
  <text x="420" y="136" font-size="13" fill="#8b949e" text-anchor="end">74% · Intermediate</text>

  <circle cx="486" cy="131" r="5" fill="#4169E1"/>
  <text x="498" y="136" font-size="15" fill="#c9d1d9">SQL</text>
  <text x="860" y="136" font-size="13" fill="#8b949e" text-anchor="end">70% · Intermediate</text>

  <!-- Legend row 3 -->
  <circle cx="46" cy="165" r="5" fill="#3776AB"/>
  <text x="58" y="170" font-size="15" fill="#c9d1d9">Python</text>
  <text x="420" y="170" font-size="13" fill="#8b949e" text-anchor="end">66% · Familiar</text>

  <line x1="40" y1="200" x2="860" y2="200" stroke="#30363d" stroke-width="1"/>

  <!-- ===== Frameworks & Technologies ===== -->
  <text x="450" y="234" font-size="20" font-weight="700" fill="#6d7cf7" text-anchor="middle">Frameworks &amp; Technologies</text>

  <g clip-path="url(#barClipFw)">
    <rect x="40"    y="252" width="182.4" height="14" fill="#02569B"/> <!-- Flutter -->
    <rect x="222.4" y="252" width="178.0" height="14" fill="#6DB33F"/> <!-- Spring Boot -->
    <rect x="400.4" y="252" width="158.5" height="14" fill="#4FC08D"/> <!-- Vue/Nuxt -->
    <rect x="558.9" y="252" width="154.2" height="14" fill="#4169E1"/> <!-- PostgreSQL -->
    <rect x="713.1" y="252" width="146.9" height="14" fill="#2496ED"/> <!-- Docker -->
  </g>

  <!-- Legend row 1 -->
  <circle cx="46" cy="289" r="5" fill="#02569B"/>
  <text x="58" y="294" font-size="15" fill="#c9d1d9">Flutter</text>
  <text x="420" y="294" font-size="13" fill="#8b949e" text-anchor="end">84% · Advanced</text>

  <circle cx="486" cy="289" r="5" fill="#6DB33F"/>
  <text x="498" y="294" font-size="15" fill="#c9d1d9">Spring Boot</text>
  <text x="860" y="294" font-size="13" fill="#8b949e" text-anchor="end">82% · Advanced</text>

  <!-- Legend row 2 -->
  <circle cx="46" cy="323" r="5" fill="#4FC08D"/>
  <text x="58" y="328" font-size="15" fill="#c9d1d9">Vue.js / Nuxt</text>
  <text x="420" y="328" font-size="13" fill="#8b949e" text-anchor="end">73% · Intermediate</text>

  <circle cx="486" cy="323" r="5" fill="#4169E1"/>
  <text x="498" y="328" font-size="15" fill="#c9d1d9">PostgreSQL</text>
  <text x="860" y="328" font-size="13" fill="#8b949e" text-anchor="end">71% · Intermediate</text>

  <!-- Legend row 3 -->
  <circle cx="46" cy="357" r="5" fill="#2496ED"/>
  <text x="58" y="362" font-size="15" fill="#c9d1d9">Docker</text>
  <text x="420" y="362" font-size="13" fill="#8b949e" text-anchor="end">68% · Familiar</text>

  <line x1="40" y1="392" x2="860" y2="392" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="422" font-size="13" fill="#8b949e" text-anchor="middle">Practical experience based on public and private projects</text>
</svg>
